"0":
  actors:
    ninten: ninten
    lloyd: lloyd
    ana: ana
    teddy: teddy
    pippi: pippi
  goto: "1"
"1":
  text: DIALOGUE_REUSABLE_PINKSHELLTELEPATHY_0
  if:
    - hasitem: GGFDiary
      goto: "2"
"2":
  text: DIALOGUE_REUSABLE_PINKSHELLTELEPATHY_2
  goto: "4"
"4":
  sound: Kid
  text: DIALOGUE_REUSABLE_PINKSHELLTELEPATHY_4
  goto: "5"
  cleardialog: true
"5":
  showbox: false
  fadein:
    speed: 0.7
    anim: Fade
    color: "FFFFFF"
  autowait: 3
  goto: "6"
  music: ""
"6":

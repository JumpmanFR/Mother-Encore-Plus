"0":
  #ninten goes to center of control panel!! right close to it
  showbox: false
  #camera moves up. conveyor belt activates and moves
  movecam:
    y: -400
    length: 3
  setflags: rat_king_2
  actors:
    ninten: leader
    ratking: Objects/NPCs/ratking
  autowait: 2
  goto: "1"
"1":
  musicvolume: -50
  #ninten hears squeak
  soundeffect: M3/Critter Cry.mp3
  text: DIALOGUE_MERRYSVILLE_CUTSCENES_RATKING2_0
  goto: "2"
"2":
  #camera goes back. reveals the rat king standing right next to ninten
  showbox: false
  movecam:
    y: -285
    length: 0.5
  teleportactors:
    ratking:
      x: -152
      y: -291
    ninten:
      x: -192
      y: -291
  actorsdir:
    ratking:
      x: -1
      y: 0
  goto: "3"
  autowait: 1.2
"3":
  #ninten does double take
  actorsturn:
    ninten:
      x: 1
      y: 0
      speed: 0.03
  autowait: 0.3
  goto: "4"
"4":
  actorsturn:
    ninten:
      x: 0
      y: -1
      speed: 0.03
  autowait: 0.5
  goto: "5"
"5":
  #ninten jumps away, startled
  actorsturn:
    ninten:
      x: 1
      y: 0
      speed: 0.02
  emoteactors:
    ninten: exclamation
  actorsjump:
    ninten:
      height: 7
      length: 0.2
  autowait: 0.5
  goto: "6"
"6":
  #rat king shakes in anger
  emoteactors:
    ratking: angry
  actorsshake:
    ratking:
      x: 1
      length: 0.5
  autowait: 1.3
  goto: "7"
"7":
  #RK steps forward, Ninten steps back
  name: RATKING_NAME
  text: DIALOGUE_MERRYSVILLE_CUTSCENES_RATKING2_1
  actorsmove:
    ratking:
      movement:
        - x: -180
          y: -291
      speed: 15
      animation: Walk
      type: position
    ninten:
      movement:
        - wait: 0.02
        - x: -203
          y: -291
      speed: 15
      animation: Walk
      type: position
      moonwalk: true
  wait: 1
  goto: "8"
"8":
  #again - RK steps forward, Ninten steps back
  name: RATKING_NAME
  text: DIALOGUE_MERRYSVILLE_CUTSCENES_RATKING2_2
  actorsmove:
    ratking:
      movement:
        - x: -200
          y: -291
      speed: 10
      animation: Walk
      type: position
    ninten:
      movement:
        - wait: 0.02
        - x: -220
          y: -291
      speed: 10
      animation: Walk
      type: position
      moonwalk: true
  wait: 1
  goto: "9"
"9":

    ninten: ninten
    lloyd: lloyd
  changecam: null
  teleportactors:
    distorto:
      x: 0
      y: -1200
  movecam:
    y: -40
    length: 1
  actorsmove:
    ninten:
      movement:
        - x: 0
          y: -42
        - x: -20
          y: 0
